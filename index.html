<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Gentle Check-in</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Press Start 2P', monospace;
      background: #5c94fc;
    }

    #start-screen {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      z-index: 1000;
    }
    .retro-btn {
      padding: 16px 28px;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: #fff;
      background: #e72521;
      border: 4px solid #fff;
      box-shadow: 4px 4px 0 #000;
      cursor: pointer;
    }

    #world {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(to bottom, #70a2ff 0%, #a2c4ff 70%, #68a0ff 100%);
      overflow: hidden;
    }

    .pixel-cloud {
      position: absolute;
      width: 64px;
      height: 24px;
      background: #fff;
      opacity: 0.85;
      box-shadow: 16px -8px 0 #fff, 32px 0 0 #fff;
    }
    .c1 { top: 14%; left: 12%; }
    .c2 { top: 24%; right: 15%; transform: scale(0.85); }

    .ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 90px;
      background: #c84c0c;
      border-top: 8px solid #00a800;
      z-index: 10;
    }

    #dialogue-bubble {
      position: absolute;
      bottom: 240px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      border: 4px solid #000;
      padding: 14px 18px;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.35);
      z-index: 50;
      max-width: 90vw;
      min-width: 270px;
      text-align: center;
      display: none;
    }
    #dialogue-bubble::after {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 45%;
      border-width: 8px;
      border-style: solid;
      border-color: #000 transparent transparent transparent;
    }
    #dialogue-bubble::before {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 45%;
      border-width: 6px;
      border-style: solid;
      border-color: #fff transparent transparent transparent;
      z-index: 2;
    }

    .bubble-text {
      font-size: 11px;
      color: #111;
      line-height: 1.8;
      margin: 0;
    }

    .inline-icon {
      width: 18px;
      height: 18px;
      vertical-align: middle;
      display: inline-block;
      margin: 0;
    }

    #stage {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 130px;
      z-index: 20;
    }

    .guy-holder {
      position: absolute;
      left: -130px;
      bottom: 0;
      width: 80px;
      height: 90px;
      transition: left 2.6s cubic-bezier(0.25, 1, 0.45, 1);
    }
    .guy-holder.walked {
      left: 44px;
    }

    .girl-holder {
      position: absolute;
      right: 44px;
      bottom: 0;
      width: 80px;
      height: 90px;
    }

    svg.character {
      width: 100%;
      height: 100%;
      display: block;
    }

    #bandaid-prop {
      position: absolute;
      left: 110px;
      bottom: 37px;
      width: 20px;
      height: 12px;
      z-index: 40;
      display: none;
      filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.3));
    }
    @keyframes applyBandAid {
      0% {
        transform: translate(-14px, -18px) rotate(-20deg) scale(1.3);
        opacity: 0.2;
      }
      60% {
        transform: translate(-1px, -2px) rotate(4deg) scale(1.05);
        opacity: 1;
      }
      100% {
        transform: translate(0px, 0px) rotate(0deg) scale(1);
        opacity: 1;
      }
    }
    .applying {
      animation: applyBandAid 0.8s ease-out forwards;
    }
  </style>
</head>
<body>

  <div id="start-screen">
    <button class="retro-btn" id="start-btn">▶ PRESS START</button>
  </div>

  <div id="world">
    <div class="pixel-cloud c1"></div>
    <div class="pixel-cloud c2"></div>

    <div id="dialogue-bubble">
      <p class="bubble-text" id="bubble-text">...</p>
    </div>

    <div id="stage">
      
      <!-- Guy -->
      <div class="guy-holder" id="guy-holder">
        <svg class="character" viewBox="0 0 24 25" shape-rendering="crispEdges">
          <path fill="#6d4c41" d="M5 2h10v4H5zM4 4h12v2H4z"/>
          <path fill="#ffcc80" d="M5 6h10v6H5z"/>
          <path fill="#3e2723" d="M6 8h2v2H6zM12 8h2v2h-2z"/>
          <path fill="#d84315" d="M7 11h1v1H7zM8 12h4v1H8zM12 11h1v1h-1z"/>
          <path fill="#43a047" d="M4 12h12v7H4z"/>
          <path fill="#2e7d32" d="M4 12h2v7H4zM14 12h2v7h-2z"/>
          <path fill="#fff" d="M2 13h2v5H2z"/>
          <path fill="#fbc02d" d="M9 16h2v2H9z"/>
          <path fill="#212121" d="M4 16h12v1H4z"/>

          <!-- Idle Arm -->
          <g id="guy-arm-idle">
            <path fill="#fff" d="M16 13h2v4h-2z"/>
            <path fill="#ffcc80" d="M16 17h2v2h-2z"/>
          </g>
          <!-- Clasped Hands -->
          <g id="guy-arm-holding" style="display: none;">
            <path fill="#fff" d="M15 13h4v3h-4z"/>
            <path fill="#ffcc80" d="M18 14h6v4h-6z"/>
            <path fill="#e0a96d" d="M21 14h2v4h-2z"/>
          </g>

          <path fill="#2e7d32" d="M5 23h4v2H5zM11 23h4v2h-4z"/>
        </svg>
      </div>

      <!-- Girl -->
      <div class="girl-holder" id="girl-holder">
        <svg class="character" viewBox="0 0 22 25" shape-rendering="crispEdges">
          <path fill="#ffee58" d="M3 2h16v12H3z"/>
          <path fill="#fbc02d" d="M2 4h18v10H2z"/>
          <path fill="#ffcc80" d="M5 6h12v6H5z"/>

          <!-- Stage 1: Looking Away -->
          <g id="girl-eyes-away">
            <path fill="#3e2723" d="M9 8h2v2H9zM14 8h2v2h-2z"/>
            <path fill="#d84315" d="M8 11h5v1H8z"/>
          </g>

          <!-- Stage 2: Head Down Sadly -->
          <g id="girl-eyes-down" style="display: none;">
            <path fill="#3e2723" d="M9 9h3v1H9zM14 9h3v1h-3zM8 10h1v1H8zM13 10h1v1h-1z"/>
            <path fill="#b91c1c" d="M9 12h4v1H9z"/>
          </g>

          <!-- Stage 3: Turned Toward Him With Blush -->
          <g id="girl-face-turned" style="display: none;">
            <path fill="#3e2723" d="M6 8h2v2H6zM11 8h2v2h-2z"/>
            <path fill="#d84315" d="M7 11h4v1H7zM8 12h2v1H8z"/>
            <path fill="#ff8a80" d="M5 10h2v1H5zM13 10h2v1h-2z"/>
          </g>

          <path fill="#1e88e5" d="M3 12h16v9H3z"/>
          <path fill="#1565c0" d="M2 13h4v4H2zM16 13h4v4h-4z"/>
          <path fill="#bbdefb" d="M7 12h8v2H7zM3 20h16v1H3z"/>
          <path fill="#ffcc80" d="M9 15h4v3H9z"/>

          <!-- Injured Hand -->
          <g id="girl-hand-default">
            <path fill="#ffcc80" d="M0 14h3v3H0z"/>
            <path id="hand-scrape" fill="#dc2626" d="M1 15h2v1H1z"/>
          </g>
          <!-- Bandaged Hand -->
          <g id="girl-bandaid" style="display: none;">
            <path fill="#d4a373" d="M0 14h4v3H0z"/>
            <path fill="#e76f51" d="M1 14h2v3H1z"/>
            <path fill="#b91c1c" d="M1 15h2v1H1z"/>
          </g>

          <path fill="#ffcc80" d="M6 21h3v2H6zM13 21h3v2h-3z"/>
          <path fill="#4e342e" d="M5 23h5v2H5zM12 23h5v2h-5z"/>
        </svg>
      </div>

      <!-- Animated Band-Aid Prop -->
      <svg id="bandaid-prop" viewBox="0 0 16 10" shape-rendering="crispEdges">
        <path fill="#d4a373" d="M2 1h12v8H2zM1 2h14v6H1z"/>
        <path fill="#e76f51" d="M6 1h4v8H6z"/>
        <path fill="#b91c1c" d="M7 3h2v4H7zM6 4h4v2H6z"/>
        <path fill="#fff" d="M7 4h2v2H7z"/>
      </svg>

    </div>

    <div class="ground"></div>
  </div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');
    const guyHolder = document.getElementById('guy-holder');
    const dialogue = document.getElementById('dialogue-bubble');
    const bubbleText = document.getElementById('bubble-text');
    const guyArmIdle = document.getElementById('guy-arm-idle');
    const guyArmHolding = document.getElementById('guy-arm-holding');
    const girlEyesAway = document.getElementById('girl-eyes-away');
    const girlEyesDown = document.getElementById('girl-eyes-down');
    const girlFaceTurned = document.getElementById('girl-face-turned');
    const girlHandDefault = document.getElementById('girl-hand-default');
    const girlBandaid = document.getElementById('girl-bandaid');
    const bandaidProp = document.getElementById('bandaid-prop');

    // Retro Pixel-Art SVG Emojis
    const iconHoldingHands = `<svg class="inline-icon" viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#ffcc80" d="M2 7h5v4H2zM9 7h5v4H9z"/><path fill="#e0a96d" d="M5 8h6v2H5z"/></svg>`;

    const iconBandaid = `<svg class="inline-icon" viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#d4a373" d="M2 5h12v6H2z"/><path fill="#e76f51" d="M6 5h4v6H6z"/><path fill="#fff" d="M7 7h2v2H7z"/></svg>`;

    const iconIceCream = `<svg class="inline-icon" viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#f43f5e" d="M5 1h6v2H5zM4 3h8v3H4z"/><path fill="#fb7185" d="M3 6h10v2H3z"/><path fill="#d97706" d="M4 8h8v2H4zM5 10h6v2H5zM6 12h4v2H6zM7 14h2v2H7z"/><path fill="#b45309" d="M6 9h1v1H6zM9 9h1v1H9zM7 11h1v1H7zM8 13h1v1H8z"/></svg>`;

    const iconHeart = `<svg class="inline-icon" viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#ec4899" d="M2 3h4v3H2zM10 3h4v3h-4zM1 6h14v4H1zM3 10h10v2H3zM5 12h6v2H5zM7 14h2v2H7z"/></svg>`;

    startBtn.addEventListener('click', () => {
      startScreen.style.display = 'none';

      // 1. Guy walks close to her
      setTimeout(() => {
        guyHolder.classList.add('walked');

        // 2. Guy arrives and asks if she's okay
        setTimeout(() => {
          dialogue.style.display = 'block';
          bubbleText.innerHTML = `Hey... is everything okay?`;

          // 3. Girl puts her head down quietly
          setTimeout(() => {
            girlEyesAway.style.display = 'none';
            girlEyesDown.style.display = 'block';
            bubbleText.innerHTML = `...`;

            // 4. He physically takes her hand + calls it out
            setTimeout(() => {
              guyArmIdle.style.display = 'none';
              guyArmHolding.style.display = 'block';
              bubbleText.innerHTML = `*takes her hand gently* ${iconHoldingHands}`;

              // 5. Applies band-aid + calls it out
              setTimeout(() => {
                bandaidProp.style.display = 'block';
                bandaidProp.classList.add('applying');

                setTimeout(() => {
                  girlHandDefault.style.display = 'none';
                  girlBandaid.style.display = 'block';
                  bandaidProp.style.display = 'none';

                  bubbleText.innerHTML = `${iconBandaid}*applies a band-aid*`;

                  // 6. Girl turns toward him with blushing cheeks
                  setTimeout(() => {
                    girlEyesDown.style.display = 'none';
                    girlFaceTurned.style.display = 'block';

                    // 7. Apology + invitation
                    setTimeout(() => {
                      bubbleText.innerHTML = `I'm sorry about the fall... <br><br> <span style="font-size: 10px; color: #b91c1c; line-height: 1.9;">Do you wanna go get some ice cream? ${iconIceCream}${iconHeart}</span>`;
                    }, 1400);

                  }, 1600);

                }, 800);

              }, 1400);

            }, 2000);

          }, 2200);

        }, 2700);

      }, 300);
    });
  </script>
</body>
</html>
